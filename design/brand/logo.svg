<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Text Joiner mark — four output rows, each a template applied to columns:
       gold syntax  (  ,  )  interleaved with filled placeholder cells — column A
       (indigo {1}) and column B (cyan {2}). The literal template holds the joined
       values; only the trailing field length varies, like real data. Concept-driven
       (the product IS a template join), not theme-driven. -->
  <rect width="512" height="512" fill="#15171C"/>

  <!-- row 1 -->
  <rect x="60"  y="140" width="22" height="46" rx="8" fill="#F4B740"/>
  <rect x="92"  y="140" width="118" height="46" rx="10" fill="#6366F1"/>
  <rect x="220" y="140" width="14" height="46" rx="6" fill="#F4B740"/>
  <rect x="244" y="140" width="128" height="46" rx="10" fill="#22D3EE"/>
  <rect x="382" y="140" width="22" height="46" rx="8" fill="#F4B740"/>

  <!-- row 2 -->
  <rect x="60"  y="198" width="22" height="46" rx="8" fill="#F4B740"/>
  <rect x="92"  y="198" width="118" height="46" rx="10" fill="#6366F1"/>
  <rect x="220" y="198" width="14" height="46" rx="6" fill="#F4B740"/>
  <rect x="244" y="198" width="104" height="46" rx="10" fill="#22D3EE"/>
  <rect x="358" y="198" width="22" height="46" rx="8" fill="#F4B740"/>

  <!-- row 3 -->
  <rect x="60"  y="256" width="22" height="46" rx="8" fill="#F4B740"/>
  <rect x="92"  y="256" width="118" height="46" rx="10" fill="#6366F1"/>
  <rect x="220" y="256" width="14" height="46" rx="6" fill="#F4B740"/>
  <rect x="244" y="256" width="140" height="46" rx="10" fill="#22D3EE"/>
  <rect x="394" y="256" width="22" height="46" rx="8" fill="#F4B740"/>

  <!-- row 4 -->
  <rect x="60"  y="314" width="22" height="46" rx="8" fill="#F4B740"/>
  <rect x="92"  y="314" width="118" height="46" rx="10" fill="#6366F1"/>
  <rect x="220" y="314" width="14" height="46" rx="6" fill="#F4B740"/>
  <rect x="244" y="314" width="116" height="46" rx="10" fill="#22D3EE"/>
  <rect x="370" y="314" width="22" height="46" rx="8" fill="#F4B740"/>
</svg>
